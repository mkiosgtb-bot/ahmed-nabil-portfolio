  <main class="container">
    <h2 class="section-title">Get In <span>Touch</span></h2>
    <p class="section-subtitle">Have a project in mind? Let's build something amazing together.</p>

    <div class="contact-box">
      <form action="success.html" method="GET">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="subject">Project Type</label>
          <input type="text" id="subject" name="subject" placeholder="e.g. Portfolio Website, UI Design" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Tell me about your project..." required></textarea>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Send Message</button>
      </form>
    </div>
  </main>
